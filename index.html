<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planner &amp; Ingredient Checker</title>
<meta name="description" content="Check if packaged food is safe for your allergies or sugar limit, and plan meals that fit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: a mobile-first web app. On phones it fills the screen; on wider screens the app sits in a centred column. */
.site{height:100%;display:flex;justify-content:center;background:var(--bg)}
.shell{width:100%;max-width:440px;height:100%;position:relative}
.shell .app{border-radius:0}
@media (min-width:641px){.shell{box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(15,23,42,.30)}}
.pick{display:flex;flex-direction:column;gap:6px}
.pick>span{font-size:13px;color:#C9D3E6}
.pick>div{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pick button{flex:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.pick button.on{background:#fff;color:#111827;border-color:#fff}
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#111827; --muted:#4B5563; --line:#D9DEE7; --soft:#F5F7FA;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFF; --good:#15803D; --good-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif; --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1220;--surface:#161D2E;--ink:#EEF2F8;--muted:#AEB8C9;--line:#2B3550;--soft:#1B2338;--accent:#8AA8FF;--accent-ink:#0D1220;--accent-soft:#1E2A4A;--good:#4ADE80;--good-soft:#123222;--warn:#FBBF24;--warn-soft:#3A2C0C;--bad:#F87171;--bad-soft:#3B1515;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1220;--surface:#161D2E;--ink:#EEF2F8;--muted:#AEB8C9;--line:#2B3550;--soft:#1B2338;--accent:#8AA8FF;--accent-ink:#0D1220;--accent-soft:#1E2A4A;--good:#4ADE80;--good-soft:#123222;--warn:#FBBF24;--warn-soft:#3A2C0C;--bad:#F87171;--bad-soft:#3B1515;color-scheme:dark}
html,body{height:100%}
html{height:100dvh}
#root{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font-weight:600;cursor:pointer;font-size:15px;background:none;color:var(--ink)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-danger{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.wait{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}

/* ---------- participant ---------- */
.ptest{height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.strip .txt{flex:1;min-width:220px}
.strip .txt p{margin:2px 0 0;font-size:15px;line-height:1.4}
.strip .acts{display:flex;gap:8px;flex-wrap:wrap}
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;min-height:0;width:100%}
.phone-wrap{width:410px;height:864px;flex:none;transform-origin:top center;position:relative}
.phone{width:410px;height:864px;border-radius:52px;background:#0B0F19;padding:10px;box-shadow:0 30px 60px -20px rgba(15,23,42,.45);position:relative}
.lock{position:absolute;inset:10px;border-radius:42px;background:rgba(15,20,33,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:28px;text-align:center}
.lock div{background:#fff;color:#111827;border-radius:18px;padding:18px 20px;font-size:16px;line-height:1.45;max-width:300px}
@media (max-width:640px){
  .ptest{padding:0;gap:0}
  .strip{border-radius:0;border-width:0 0 1px;max-width:none;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
  .stage{align-items:stretch}
  .phone-wrap{width:100%;height:100%;transform:none!important;margin:0!important}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .phone .app{border-radius:0}
  .lock{inset:0;border-radius:0}
}

/* ---------- owner dashboard ---------- */
.owner{max-width:1200px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.ohead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ohead h1{font-size:clamp(26px,4vw,34px)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-family:var(--font-head);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h2{font-size:21px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.goal.focus{border:2px solid var(--accent)}
.goal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal h3{font-size:16px;line-height:1.3}
.goal dl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;margin:0;font-size:14px}
.goal dt{color:var(--muted);font-weight:600}
.goal dd{margin:0}
.goal .res{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.goal .res b{font-family:var(--font-head);font-size:22px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;background:var(--soft)}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--soft)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.tcard .big{font-family:var(--font-head);font-size:24px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv span:first-child{color:var(--muted)}
.qform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.qform{grid-template-columns:1fr}}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:14px;margin-bottom:6px;padding:0}
.rate{display:flex;gap:6px}
.rate label{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;position:relative;background:var(--surface)}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
textarea.o{width:100%;min-height:72px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.log{max-height:420px;overflow:auto}
.log td:first-child{white-space:nowrap;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.plan td:first-child{font-weight:600;white-space:nowrap}
.status{font-size:13px;color:var(--muted)}

/* ---------- the app (fixed light look, as designed in Figma) ---------- */
.app{--b6:#1D4ED8;--b7:#1E40AF;--b1:#DBE6FE;--b0:#EFF4FF;--i9:#111827;--i6:#4B5563;--i5:#6B7280;--ln:#E5E7EB;--ls:#C9CED6;--cv:#F5F7FA;--mu:#EEF1F5;--d7:#B91C1C;--d8:#991B1B;--d1:#FEE2E2;--d0:#FEF2F2;--w8:#92400E;--w7:#B45309;--w1:#FEF3C7;--w0:#FFFBEB;--s8:#166534;--s7:#15803D;--s1:#DCFCE7;--s0:#F0FDF4;
  position:relative;width:100%;height:100%;background:var(--cv);color:var(--i9);border-radius:42px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-body);font-size:17px;line-height:24px;color-scheme:light}
.app button{font:inherit;color:inherit}
.a-top{flex:none;display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 26px 0 30px;font-weight:600;font-size:15px}
.a-top.dark{color:#fff}
.a-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch}
.a-body{display:flex;flex-direction:column;gap:14px;padding:8px 20px 24px}
.a-title{font-size:28px;line-height:34px;font-weight:700;margin:0}
.a-h{font-size:20px;line-height:26px;font-weight:600;margin:0}
.a-cap{font-size:15px;line-height:20px;color:var(--i6)}
.a-small{font-size:13px;line-height:16px;font-weight:500;color:var(--i6)}
.a-strong{font-weight:600}
.a-card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.a-row{display:flex;align-items:center;gap:12px}
.a-row>.grow{flex:1;min-width:0}
.a-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;border:1.5px solid transparent;font-weight:600;cursor:pointer;padding:0 18px;width:100%;text-align:center;transition:transform .08s}
.a-btn:active{transform:scale(.98)}
.a-btn.p{background:var(--b6);color:#fff}
.a-btn.s{background:#fff;color:var(--i9);border-color:var(--ls)}
.a-btn.t{background:none;color:var(--b6);min-height:44px}
.a-btn[disabled]{background:var(--mu);color:var(--i5);border-color:transparent;cursor:not-allowed}
.a-btn.dash{border-style:dashed;border-color:var(--ls);background:transparent;color:var(--b7)}
.a-iconbtn{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--ln);cursor:pointer;flex:none}
.a-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 14px;border-radius:22px;border:1.5px solid var(--ls);background:#fff;font-size:15px;font-weight:500;cursor:pointer}
.a-chip.on{background:var(--b0);border-color:var(--b6);color:var(--b7)}
.a-chips{display:flex;flex-wrap:wrap;gap:8px}
.a-badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:15px;font-size:13px;font-weight:600;white-space:nowrap}
.a-badge.safe{background:var(--s1);color:var(--s8)} .a-badge.unc{background:var(--w1);color:var(--w8)} .a-badge.bad{background:var(--d1);color:var(--d8)}
.a-tile{width:48px;height:48px;border-radius:12px;background:var(--mu);display:flex;align-items:center;justify-content:center;flex:none}
.a-list{display:flex;flex-direction:column;gap:10px}
.a-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;cursor:pointer;text-align:left;width:100%}
.a-item.sel{border:2px solid var(--b6);background:var(--b0)}
.a-nav{flex:none;height:84px;background:#fff;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:8px;position:relative}
.a-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--i6);cursor:pointer;min-height:48px;padding:2px}
.a-nav button.on{color:var(--b7);font-weight:700}
.a-nav .scanbtn{margin-top:-30px}
.a-nav .scanbtn span.c{width:62px;height:62px;border-radius:31px;background:var(--b6);display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 6px 14px rgba(29,78,216,.35)}
.a-foot{flex:none;background:#fff;border-top:1px solid var(--ln);padding:12px 20px 26px;display:flex;gap:12px}
.a-prog{display:flex;gap:6px}.a-prog span{flex:1;height:6px;border-radius:3px;background:var(--ln)}.a-prog span.on{background:var(--b6)}
.a-input{width:100%;border:1.5px solid var(--ls);border-radius:12px;padding:12px 14px;font-size:17px;background:#fff;color:var(--i9);min-height:52px}
.a-input:focus{outline:none;border-color:var(--b6);box-shadow:0 0 0 3px var(--b1)}
textarea.a-input{min-height:120px;resize:none;line-height:24px}
.a-opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--ls);background:#fff;cursor:pointer;text-align:left;width:100%}
.a-opt.on{border:2px solid var(--b6);background:var(--b0)}
.a-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--ls);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.a-opt.on .a-check,.a-check.on{background:var(--b6);border-color:var(--b6)}
.a-radio{width:24px;height:24px;border-radius:12px;border:2px solid var(--ls);display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.a-opt.on .a-radio{border-color:var(--b6)} .a-opt.on .a-radio::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--b6)}
.a-sev{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.a-sev button{min-height:48px;border-radius:12px;border:1.5px solid var(--ls);background:#fff;font-weight:600;cursor:pointer}
.a-sev button.on{background:var(--b6);border-color:var(--b6);color:#fff}
.a-switch{width:52px;height:32px;border-radius:16px;background:var(--ls);border:0;position:relative;cursor:pointer;flex:none}
.a-switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.a-switch.on{background:var(--b6)} .a-switch.on::after{left:23px}
.a-banner{display:flex;gap:14px;align-items:flex-start;padding:6px 20px 18px}
.a-banner .eb{font-size:13px;font-weight:600;letter-spacing:.06em}
.a-reason{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.a-reason.bad{background:var(--d0);border:1.5px solid var(--d7)} .a-reason.unc{background:var(--w0);border:1px solid var(--w1)} .a-reason.safe{background:var(--s0);border:1px solid var(--s1)} .a-reason.info{background:var(--mu)}
.a-src{background:var(--mu);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.a-toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--i9);color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;z-index:30;animation:tin .2s ease-out}
.a-toast.nonav{bottom:24px}
.a-toast.withfoot{bottom:112px}
.a-toast button{background:none;border:0;color:#BFD0FF;font-weight:700;min-height:44px;padding:0 12px;cursor:pointer}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.a-sheetwrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.a-dim{position:absolute;inset:0;background:rgba(17,24,39,.5);border:0;cursor:pointer}
.a-sheet{position:relative;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto;animation:sup .22s ease-out}
.a-sheet .handle{width:44px;height:5px;border-radius:3px;background:var(--ls);align-self:center}
@keyframes sup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.a-bar{position:relative;height:10px;border-radius:5px;background:var(--ln);margin:6px 0}
.a-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.a-bar b{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:var(--i9)}
.a-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.a-days button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border-radius:12px;border:1px solid var(--ls);background:#fff;cursor:pointer;font-weight:600;padding:0}
.a-days button small{font-size:12px;font-weight:500;color:var(--i6)}
.a-days button.on{background:var(--b6);border-color:var(--b6);color:#fff}.a-days button.on small{color:#fff}
.a-days button.has::after{content:"";width:5px;height:5px;border-radius:3px;background:currentColor;opacity:.6;margin-top:2px}
/* camera */
.cam{background:#0F1421;color:#fff}
.cam .a-body{gap:14px}
.cam-pill{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.16);font-size:15px;font-weight:500}
.cam-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.12)}
.cam-seg button{min-height:40px;border-radius:10px;border:0;background:none;color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.cam-seg button.on{background:#fff;color:var(--i9)}
.vf{position:relative;height:360px;border-radius:22px;background:#2E333D;overflow:hidden}
.vf .paper{position:absolute;left:44px;right:44px;top:52px;background:#F5F0E3;color:#1b1b1b;border-radius:6px;padding:16px;transform:rotate(-2deg);font-size:13px;line-height:18px}
.vf .paper b{font-size:12px;letter-spacing:.06em}
.vf .glare{position:absolute;left:70px;top:100px;width:220px;height:80px;border-radius:50%;background:rgba(255,255,255,.88);filter:blur(16px)}
.vf .cn{position:absolute;width:42px;height:42px;border:5px solid #fff}.vf .tl{left:24px;top:24px;border-right:0;border-bottom:0;border-top-left-radius:14px}.vf .tr{right:24px;top:24px;border-left:0;border-bottom:0;border-top-right-radius:14px}.vf .bl{left:24px;bottom:64px;border-right:0;border-top:0;border-bottom-left-radius:14px}.vf .br{right:24px;bottom:64px;border-left:0;border-top:0;border-bottom-right-radius:14px}

function tr(s){const k=String(s).replace(/\s+/g,' ').trim();if(!k||!/[A-Za-z]/.test(k))return s;let v=AR[k];
 if(v==null){for(const [rx,rp] of AR_RX){if(rx.test(k)){const out=k.replace(rx,rp);if(out!==k){v=out;break;}}}}
 if(v==null&&k.includes(' · ')){const parts=k.split(' · ');const t=parts.map(p=>{const x=tr(p);return x;});if(t.some((x,i)=>x!==parts[i]))v=t.join(' · ');}
 if(v==null&&/^✓ /.test(k)){const x=tr(k.slice(2));if(x!==k.slice(2))v='✓ '+x;}
 return v==null?s:s.replace(k,v);}

 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{if(n.parentElement&&n.parentElement.closest('.num,.notr,script,style,textarea'))return;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;});
 root.querySelectorAll('[placeholder],[aria-label]').forEach(e=>['placeholder','aria-label'].forEach(at=>{const v=e.getAttribute(at);if(v){const t=tr(v);if(t!==v)e.setAttribute(at,t);}}));}

function weekGlance(){const a=A();const P=prof();const es=[];Object.values(a.plan).forEach(day=>Object.values(day).forEach(e=>{const r=R(e.rid);if(r)es.push({r,sugar:e.swap&&r.swaps?r.swaps[e.swap].sugar:r.sugar});}));
